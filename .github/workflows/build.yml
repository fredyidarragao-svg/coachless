name: Compilar Coachless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK y AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma
        run: flutter create . --org app.coachless --project-name coachless --platforms android,ios
      - name: Aplicar permisos y ajustes de plataforma
        run: python3 tool/patch_platforms.py
      - run: bash tool/ci_run.sh flutter pub get
      - name: Ícono de la app
        run: bash tool/ci_run.sh dart run flutter_launcher_icons
      - name: Analizar código
        run: bash tool/ci_run.sh flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: bash tool/ci_run.sh flutter build apk --release
      - name: Compilar AAB (Google Play)
        run: bash tool/ci_run.sh flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: coachless-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Preparar archivos de la versión
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Coachless.apk
          cp build/app/outputs/bundle/release/app-release.aab Coachless-GooglePlay.aab
      - name: Publicar en Releases para instalar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Coachless (compilación ${{ github.run_number }})
          prerelease: true
          body: |
            **Android:** descarga **Coachless.apk** desde el celular e instálalo.
            **iPhone y computador:** abre https://fredyidarragao-svg.github.io/coachless/ en Safari o Chrome y agrégala a la pantalla de inicio.
            El archivo .aab es el que se sube a Google Play.
          files: |
            Coachless.apk
            Coachless-GooglePlay.aab

  web:
    name: Versión web (iPhone y computador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma
        run: flutter create . --org app.coachless --project-name coachless --platforms android,ios,web
      - name: Aplicar ajustes de plataforma
        run: python3 tool/patch_platforms.py
      - run: bash tool/ci_run.sh flutter pub get
      - name: Ícono de la app
        run: bash tool/ci_run.sh dart run flutter_launcher_icons
      - name: Compilar versión web
        run: bash tool/ci_run.sh flutter build web --release --base-href /coachless/
      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Versión web de Coachless

  ios:
    name: iPhone (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma
        run: flutter create . --org app.coachless --project-name coachless --platforms android,ios
      - name: Aplicar permisos y ajustes de plataforma
        run: python3 tool/patch_platforms.py
      - run: bash tool/ci_run.sh flutter pub get
      - name: Ícono de la app
        run: bash tool/ci_run.sh dart run flutter_launcher_icons
      - name: Compilar iOS sin firma
        run: bash tool/ci_run.sh flutter build ios --release --no-codesign
      - name: Empaquetar
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr coachless-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: coachless-ios-sin-firma
          path: coachless-unsigned.ipa
