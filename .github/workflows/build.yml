name: Compilar Coachless

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK y AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma
        run: flutter create . --org app.coachless --project-name coachless --platforms android,ios
      - name: Aplicar permisos y ajustes de plataforma
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Ícono de la app
        run: dart run flutter_launcher_icons
      - name: Analizar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: flutter build apk --release
      - name: Compilar AAB (Google Play)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: coachless-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iPhone (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpetas de plataforma
        run: flutter create . --org app.coachless --project-name coachless --platforms android,ios
      - name: Aplicar permisos y ajustes de plataforma
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Ícono de la app
        run: dart run flutter_launcher_icons
      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign
      - name: Empaquetar
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr coachless-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: coachless-ios-sin-firma
          path: coachless-unsigned.ipa
